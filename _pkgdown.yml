url: https://igordot.github.io/clustermole/

template:
  bootstrap: 5
  bootswatch: zephyr
  includes:
    after_body: >
      <script data-goatcounter="https://igordot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  opengraph:
    twitter:
      creator: "@bioigor"
      card: summary_large_image

navbar:
  # zephyr navbar is blue by default
  bg: light
  structure:
    left: [home, intro, example, db, reference]
    right: []
  components:
    home: ~
    articles: ~
    intro:
      text: Get Started
      href: articles/clustermole-intro.html
    example:
      text: Usage Example
      href: articles/example-bm-seurat.html
    db:
      text: Database Stats
      href: articles/db.html
